name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build for ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            goos: linux
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Install frontend dependencies
        working-directory: ./client
        run: bun install

      - name: Build frontend
        working-directory: ./client
        run: bun run build

      - name: Build Go binary
        working-directory: ./server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME="vps_pilot-${{ matrix.os }}-${{ matrix.arch }}"
          go build -ldflags "-s -w -X main.Version=${{ github.ref_name }}" -o "${BINARY_NAME}" .
          
      - name: Create archive
        working-directory: ./server
        run: |
          BINARY_NAME="vps_pilot-${{ matrix.os }}-${{ matrix.arch }}"
          ARCHIVE_NAME="vps_pilot-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}"
          tar -czf "${ARCHIVE_NAME}.tar.gz" "${BINARY_NAME}"
          echo "ASSET_PATH=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vps_pilot-${{ matrix.os }}-${{ matrix.arch }}
          path: server/${{ env.ASSET_PATH }}

  agent:
    name: Build agent for linux - ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cargo-zigbuild
        run: pip install ziglang cargo-zigbuild

      - name: Build static agent binary
        working-directory: ./agent
        env:
          VPS_PILOT_VERSION: ${{ github.ref_name }}
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Create archive
        run: |
          BINARY_NAME="vps-pilot-agent"
          ARCHIVE_NAME="vps-pilot-agent-${{ github.ref_name }}-linux-${{ matrix.arch }}"
          cp "agent/target/${{ matrix.target }}/release/${BINARY_NAME}" .
          cp agent/packaging/vps-pilot-agent.service .
          tar -czf "${ARCHIVE_NAME}.tar.gz" "${BINARY_NAME}" vps-pilot-agent.service
          echo "ASSET_PATH=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vps-pilot-agent-linux-${{ matrix.arch }}
          path: ${{ env.ASSET_PATH }}

  release:
    name: Create Release
    needs: [build, agent]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Checksums
        run: |
          mkdir dist
          find artifacts -type f -name '*.tar.gz' -exec mv {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
