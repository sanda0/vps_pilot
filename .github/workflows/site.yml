name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Keep in sync with the comment and [module.hugoVersion] in site/hugo.toml.
  HUGO_VERSION: 0.167.0

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Hugo
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl -fsSLO "${base}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLO "${base}/hugo_${HUGO_VERSION}_checksums.txt"
          grep " hugo_${HUGO_VERSION}_linux-amd64.tar.gz\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c
          tar -xzf "hugo_${HUGO_VERSION}_linux-amd64.tar.gz" hugo
          sudo install hugo /usr/local/bin/hugo
          hugo version

      - name: Build site
        working-directory: ./site
        # baseURL (https://vpspilot.dev/) comes from hugo.toml; static/CNAME
        # sets the custom domain. Any warning, e.g. a broken link, fails.
        run: hugo --minify --panicOnWarning

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./site/public

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
