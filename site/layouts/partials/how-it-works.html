{{- /* Hub and agents. A wide diagram for large screens and a tall one for
  phones; colors come from the CSS tokens so both themes work. */ -}}
<figure class="diagram">
  <svg class="diagram-wide" viewBox="0 0 880 320" role="img" aria-labelledby="diagram-wide-title">
    <title id="diagram-wide-title">Your browser opens the dashboard on the hub over HTTPS. Each server's agent dials the hub over TLS 1.3 on port 55001 and pins its certificate.</title>
    <defs>
      <marker id="arrow-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="d-arrow-agent" d="M0 0L10 5L0 10z"/></marker>
      <marker id="arrow-browser" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="d-arrow-browser" d="M0 0L10 5L0 10z"/></marker>
    </defs>
    <path class="d-line-browser" d="M170 150H318" marker-end="url(#arrow-browser)"/>
    <path class="d-line-agent" d="M700 55L532 147" marker-end="url(#arrow-agent)"/>
    <path class="d-line-agent" d="M700 150H532" marker-end="url(#arrow-agent)"/>
    <path class="d-line-agent" d="M700 245L532 153" marker-end="url(#arrow-agent)"/>
    <text class="d-label" x="246" y="138">HTTPS</text>
    <text class="d-label d-muted" x="246" y="174">your domain</text>
    <rect class="d-label-bg" x="560" y="125" width="110" height="18"/>
    <text class="d-label" x="615" y="138">TLS 1.3 :55001</text>
    <rect class="d-label-bg" x="560" y="160" width="110" height="18"/>
    <text class="d-label d-muted" x="615" y="173">pinned certificate</text>
    <rect class="d-box" x="20" y="115" width="150" height="70"/>
    <text class="d-title" x="95" y="145">Your browser</text>
    <text class="d-sub" x="95" y="166">dashboard</text>
    <rect class="d-box d-hub" x="320" y="90" width="210" height="120"/>
    <text class="d-title" x="425" y="128">Hub</text>
    <text class="d-sub d-mono" x="425" y="152">vps_pilot</text>
    <text class="d-sub" x="425" y="176">Go · SQLite · dashboard</text>
    {{- range $i, $name := slice "web-1" "web-2" "db-1" }}
    {{- $y := add 26 (mul $i 95) }}
    <rect class="d-box" x="700" y="{{ $y }}" width="160" height="58"/>
    <text class="d-title" x="780" y="{{ add $y 25 }}">{{ $name }}</text>
    <text class="d-sub d-mono" x="780" y="{{ add $y 45 }}">vps-pilot-agent</text>
    {{- end }}
    <text class="d-label d-muted" x="780" y="306">enrolls once with a join token</text>
  </svg>
  <svg class="diagram-tall" viewBox="0 0 340 540" role="img" aria-labelledby="diagram-tall-title">
    <title id="diagram-tall-title">Your browser opens the dashboard on the hub over HTTPS. Each server's agent dials the hub over TLS 1.3 on port 55001 and pins its certificate.</title>
    <defs>
      <marker id="arrow-agent-tall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="d-arrow-agent" d="M0 0L10 5L0 10z"/></marker>
      <marker id="arrow-browser-tall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="d-arrow-browser" d="M0 0L10 5L0 10z"/></marker>
    </defs>
    <path class="d-line-browser" d="M170 70V148" marker-end="url(#arrow-browser-tall)"/>
    <path class="d-line-agent" d="M55 420L166 262" marker-end="url(#arrow-agent-tall)"/>
    <path class="d-line-agent" d="M170 420V262" marker-end="url(#arrow-agent-tall)"/>
    <path class="d-line-agent" d="M285 420L174 262" marker-end="url(#arrow-agent-tall)"/>
    <text class="d-label d-start" x="182" y="105">HTTPS</text>
    <text class="d-label d-muted d-start" x="182" y="122">your domain</text>
    <rect class="d-label-bg" x="118" y="322" width="104" height="18"/>
    <text class="d-label" x="170" y="335">TLS 1.3 :55001</text>
    <rect class="d-label-bg" x="118" y="350" width="104" height="18"/>
    <text class="d-label d-muted" x="170" y="363">pinned certificate</text>
    <rect class="d-box" x="95" y="10" width="150" height="60"/>
    <text class="d-title" x="170" y="37">Your browser</text>
    <text class="d-sub" x="170" y="57">dashboard</text>
    <rect class="d-box d-hub" x="65" y="150" width="210" height="110"/>
    <text class="d-title" x="170" y="185">Hub</text>
    <text class="d-sub d-mono" x="170" y="209">vps_pilot</text>
    <text class="d-sub" x="170" y="232">Go · SQLite · dashboard</text>
    {{- range $i, $name := slice "web-1" "web-2" "db-1" }}
    {{- $x := add 5 (mul $i 115) }}
    <rect class="d-box" x="{{ $x }}" y="420" width="100" height="58"/>
    <text class="d-title" x="{{ add $x 50 }}" y="445">{{ $name }}</text>
    <text class="d-sub d-mono" x="{{ add $x 50 }}" y="465">agent</text>
    {{- end }}
    <text class="d-label d-muted" x="170" y="510">each enrolls once with a join token</text>
  </svg>
</figure>
