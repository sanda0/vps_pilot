{{- /* Wide tables scroll inside their own box instead of the page. */ -}}
<div class="table-wrap">
<table>
  <thead>
    {{- range .THead }}
    <tr>{{ range . }}<th>{{ .Text }}</th>{{ end }}</tr>
    {{- end }}
  </thead>
  <tbody>
    {{- range .TBody }}
    <tr>{{ range . }}<td>{{ .Text }}</td>{{ end }}</tr>
    {{- end }}
  </tbody>
</table>
</div>
