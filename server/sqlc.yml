version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/db/sql/query/"
    schema: "internal/db/sql/migrations/"
    gen:
      go:
        package: "db"
        out: "internal/db"
        emit_json_tags: true
        emit_prepared_queries: true
        overrides:
          - column: "nodes.key_hash"
            go_struct_tag: 'json:"-"'
          - column: "agent_join_tokens.token_hash"
            go_struct_tag: 'json:"-"'
